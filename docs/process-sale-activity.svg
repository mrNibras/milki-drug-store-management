<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="2220" viewBox="0 0 1680 2220">
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#52677b"/></marker><marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#52677b" stroke-width="1.5"/></marker><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#20384f" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="54" y="52" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#638096">MILKI DRUG STORE MANAGEMENT SYSTEM</text>
<text x="54" y="100" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#172c42">Activity Diagram — Process Sale</text>
<text x="54" y="137" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53677c">Authenticated sale request, batch-aware stock handling, payment recording and error paths</text>
<circle cx="800" cy="205" r="17" fill="#20384f"/>
<path d="M800,222 L800,255" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="500" y="255" width="600" height="86" rx="15" fill="#ffffff" stroke="#d5e0e9" stroke-width="1.5"/><rect x="500" y="255" width="9" height="86" rx="4" fill="#4778a8"/></g><text x="525" y="281" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#4778a8">PHARMACIST</text><text x="800.0" y="309" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">Search the catalog; select medicines or cosmetics</text>
<path d="M800,341 L800,365" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="500" y="365" width="600" height="86" rx="15" fill="#ffffff" stroke="#d5e0e9" stroke-width="1.5"/><rect x="500" y="365" width="9" height="86" rx="4" fill="#218b83"/></g><text x="525" y="391" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#218b83">REACT POS</text><text x="800.0" y="419" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">Enter quantities, payment details and optional discount</text>
<path d="M800,451 L800,475" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="500" y="475" width="600" height="92" rx="15" fill="#ffffff" stroke="#d5e0e9" stroke-width="1.5"/><rect x="500" y="475" width="9" height="92" rx="4" fill="#7966a7"/></g><text x="525" y="501" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#7966a7">API / AUTHORIZATION</text><text x="800.0" y="529" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">POST /api/sales; authenticate JWT; validate sale items</text>
<path d="M800,567 L800,590" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polygon points="800,588 945,650 800,712 655,650" fill="#fff8e8" stroke="#c38a35" stroke-width="2"/><text x="800" y="645.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d4d1e">Authorized and</text><text x="800" y="666.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d4d1e">request valid?</text>
<path d="M945,650 L1190,650 L1190,680" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1060" y="636" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#52677b">No</text>
<rect x="1050" y="680" width="290" height="82" rx="13" fill="#fff0ef" stroke="#d9746d" stroke-width="1.8"/><text x="1195.0" y="711" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#9b3833">Reject request</text><text x="1195.0" y="734" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#9b3833">401 JWT / 400 invalid items</text>
<path d="M1195,762 L1195,790" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="1195" cy="808" r="15" fill="#f3f6fa" stroke="#20384f" stroke-width="4"/>
<path d="M800,712 L800,755" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="830" y="740" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#52677b">Yes</text>
<g filter="url(#shadow)"><rect x="500" y="755" width="600" height="88" rx="15" fill="#ffffff" stroke="#d5e0e9" stroke-width="1.5"/><rect x="500" y="755" width="9" height="88" rx="4" fill="#7966a7"/></g><text x="525" y="781" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#7966a7">SALESERVICE</text><text x="800.0" y="809" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">Begin transaction; allocate sale number</text>
<path d="M800,843 L800,865" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="500" y="865" width="600" height="106" rx="15" fill="#ffffff" stroke="#d5e0e9" stroke-width="1.5"/><rect x="500" y="865" width="9" height="106" rx="4" fill="#bd8737"/></g><text x="525" y="891" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#bd8737">PERSISTENCE / SALESERVICE</text><text x="800.0" y="919" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">For each line, load eligible in-branch batches</text><text x="800.0" y="942" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">Order by expiry; honor manual selection where enabled</text>
<path d="M800,971 L800,990" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polygon points="800,990 945,1050 800,1110 655,1050" fill="#fff8e8" stroke="#c38a35" stroke-width="2"/><text x="800" y="1045.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d4d1e">Enough stock</text><text x="800" y="1066.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d4d1e">for this line?</text>
<path d="M945,1050 L1190,1050" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1060" y="1036" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#52677b">No</text>
<rect x="1050" y="1010" width="290" height="82" rx="13" fill="#fff0ef" stroke="#d9746d" stroke-width="1.8"/><text x="1195.0" y="1041" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#9b3833">Rollback transaction</text><text x="1195.0" y="1064" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#9b3833">HTTP 400: insufficient stock</text>
<path d="M1195,1092 L1195,1115" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="1195" cy="1133" r="15" fill="#f3f6fa" stroke="#20384f" stroke-width="4"/>
<path d="M800,1110 L800,1140" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="830" y="1130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#52677b">Yes</text>
<g filter="url(#shadow)"><rect x="500" y="1140" width="600" height="100" rx="15" fill="#ffffff" stroke="#d5e0e9" stroke-width="1.5"/><rect x="500" y="1140" width="9" height="100" rx="4" fill="#7966a7"/></g><text x="525" y="1166" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#7966a7">SALESERVICE</text><text x="800.0" y="1194" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">Issue batch quantity; stage sale line</text><text x="800.0" y="1217" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">and inventory transaction</text>
<path d="M800,1240 L800,1260" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polygon points="800,1260 945,1320 800,1380 655,1320" fill="#fff8e8" stroke="#c38a35" stroke-width="2"/><text x="800" y="1315.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d4d1e">More sale</text><text x="800" y="1336.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d4d1e">items?</text>
<path d="M655,1320 L410,1320 L410,918 L500,918" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="420" y="1300" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#52677b">Yes — next item</text>
<path d="M800,1380 L800,1400" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="835" y="1396" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#52677b">No</text>
<g filter="url(#shadow)"><rect x="500" y="1400" width="600" height="100" rx="15" fill="#ffffff" stroke="#d5e0e9" stroke-width="1.5"/><rect x="500" y="1400" width="9" height="100" rx="4" fill="#7966a7"/></g><text x="525" y="1426" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#7966a7">SALESERVICE</text><text x="800.0" y="1454" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">Apply role-based discount limit; require a reason</text><text x="800.0" y="1477" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">when any discount is applied</text>
<path d="M800,1500 L800,1520" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polygon points="800,1520 955,1580 800,1640 645,1580" fill="#fff8e8" stroke="#c38a35" stroke-width="2"/><text x="800" y="1575.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d4d1e">Discount rule</text><text x="800" y="1596.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d4d1e">satisfied?</text>
<path d="M955,1580 L1190,1580" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1065" y="1566" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#52677b">No</text>
<rect x="1050" y="1540" width="290" height="82" rx="13" fill="#fff0ef" stroke="#d9746d" stroke-width="1.8"/><text x="1195.0" y="1571" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#9b3833">Rollback transaction</text><text x="1195.0" y="1594" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#9b3833">HTTP 400: discount reason required</text>
<path d="M1195,1622 L1195,1640" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="1195" cy="1658" r="15" fill="#f3f6fa" stroke="#20384f" stroke-width="4"/>
<path d="M800,1640 L800,1670" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="830" y="1660" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#52677b">Yes</text>
<g filter="url(#shadow)"><rect x="500" y="1670" width="600" height="92" rx="15" fill="#ffffff" stroke="#d5e0e9" stroke-width="1.5"/><rect x="500" y="1670" width="9" height="92" rx="4" fill="#7966a7"/></g><text x="525" y="1696" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#7966a7">SALESERVICE</text><text x="800.0" y="1724" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">Calculate totals, profit and payment status</text>
<path d="M800,1762 L800,1782" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="500" y="1782" width="600" height="96" rx="15" fill="#ffffff" stroke="#d5e0e9" stroke-width="1.5"/><rect x="500" y="1782" width="9" height="96" rx="4" fill="#bd8737"/></g><text x="525" y="1808" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#bd8737">PERSISTENCE / UNIT OF WORK</text><text x="800.0" y="1836" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">Save sale, sale items and inventory changes; commit</text>
<path d="M800,1878 L800,1898" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="500" y="1898" width="600" height="90" rx="15" fill="#ffffff" stroke="#d5e0e9" stroke-width="1.5"/><rect x="500" y="1898" width="9" height="90" rx="4" fill="#7966a7"/></g><text x="525" y="1924" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#7966a7">AUDIT / INVENTORY</text><text x="800.0" y="1952" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">Write audit log; evaluate low-stock thresholds</text>
<path d="M800,1988 L800,2008" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="500" y="2008" width="600" height="88" rx="15" fill="#ffffff" stroke="#d5e0e9" stroke-width="1.5"/><rect x="500" y="2008" width="9" height="88" rx="4" fill="#218b83"/></g><text x="525" y="2034" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#218b83">POS / PHARMACIST</text><text x="800.0" y="2062" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#24394d">Return HTTP 200 SaleResponse and show receipt</text>
<path d="M800,2096 L800,2120" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="800" cy="2138" r="16" fill="#20384f"/>
<circle cx="800" cy="2138" r="8" fill="#f3f6fa"/>
<text x="54" y="2182" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#53677c">Payment method and amount are recorded by the system; the sale flow does not call an external payment gateway.</text>
