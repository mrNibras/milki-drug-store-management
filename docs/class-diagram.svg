<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1800" viewBox="0 0 2600 1800" role="img" aria-labelledby="title desc">
  <title id="title">Milki Drug Store Management System class diagram</title>
  <desc id="desc">Figma-inspired UML class diagram of the system's sale and inventory domain, showing sale, user, branch, product, batch, and inventory transaction classes.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#24364b" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#6b7f96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 750; letter-spacing: 2.2px; fill: #71839a; }
      .title { font-size: 43px; font-weight: 750; fill: #172a41; }
      .subtitle { font-size: 19px; font-weight: 450; fill: #66788e; }
      .zone { font-size: 15px; font-weight: 750; letter-spacing: 1.8px; fill: #8191a5; }
      .stereo { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .className { font-size: 23px; font-weight: 720; fill: #1e3047; }
      .field { font-size: 17px; font-weight: 450; fill: #52647a; }
      .small { font-size: 14px; font-weight: 600; fill: #60738a; }
      .edgeLabel { font-size: 14px; font-weight: 650; fill: #53677e; }
      .pill { font-size: 14px; font-weight: 650; fill: #52657c; }
    </style>
  </defs>
  <rect width="2600" height="1800" fill="#f4f7fb"/>
  <circle cx="2460" cy="78" r="240" fill="#e9f1fb" opacity=".55"/>
  <circle cx="2360" cy="165" r="140" fill="#f0ebff" opacity=".42"/>

  <text x="70" y="66" class="eyebrow">MILKI DRUG STORE MANAGEMENT SYSTEM</text>
  <text x="70" y="122" class="title">Class diagram</text>
  <text x="70" y="158" class="subtitle">Sale and inventory domain · the core model behind checkout and stock updates</text>
  <rect x="2074" y="76" width="176" height="38" rx="19" fill="#e7eff9"/>
  <circle cx="2098" cy="95" r="5" fill="#4778a8"/>
  <text x="2113" y="100" class="pill">DOMAIN MODEL</text>
  <rect x="2262" y="76" width="258" height="38" rx="19" fill="#efeaff"/>
  <circle cx="2286" cy="95" r="5" fill="#7966a7"/>
  <text x="2301" y="100" class="pill">SALES · INVENTORY</text>

  <rect x="55" y="220" width="2490" height="1500" rx="28" fill="#ffffff" stroke="#e4eaf2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="92" y="270" class="zone">SALES &amp; STORE CONTEXT</text>
  <text x="92" y="890" class="zone">PRODUCTS &amp; BATCHES</text>
  <text x="92" y="1370" class="zone">STOCK TRACEABILITY</text>

  <!-- UML relationships are drawn behind class cards. -->
  <!-- Branch has many sales. -->
  <path d="M900 360 V310 H2150 V360" fill="none" stroke="#71849b" stroke-width="2.2"/>
  <rect x="1445" y="292" width="170" height="34" rx="17" fill="#f4f7fb" stroke="#e2e8f0"/>
  <text x="1530" y="314" text-anchor="middle" class="edgeLabel">belongs to</text>
  <text x="915" y="353" class="small">0..*</text>
  <text x="2164" y="353" class="small">1</text>

  <!-- User records a sale. -->
  <path d="M495 485 H650" fill="none" stroke="#71849b" stroke-width="2.2"/>
  <text x="506" y="470" class="small">1</text>
  <text x="622" y="470" class="small">0..*</text>
  <rect x="523" y="493" width="98" height="30" rx="15" fill="#ffffff" stroke="#e3e9f1"/>
  <text x="572" y="513" text-anchor="middle" class="edgeLabel">records</text>

  <!-- Sale owns its line items. -->
  <path d="M1167 535 H1280" fill="none" stroke="#71849b" stroke-width="2.2"/>
  <polygon points="1150,525 1167,535 1150,545 1133,535" fill="#71849b"/>
  <text x="1110" y="515" class="small">1</text>
  <text x="1289" y="515" class="small">0..*</text>

  <!-- SaleItem may reference a medicine batch or a cosmetic batch. -->
  <path d="M1370 750 V820 H925 V950" fill="none" stroke="#8294a9" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1044" y="802" width="188" height="32" rx="16" fill="#ffffff" stroke="#e5eaf1"/>
  <text x="1138" y="823" text-anchor="middle" class="edgeLabel">medicine batch</text>
  <text x="1382" y="770" class="small">0..*</text>
  <text x="936" y="943" class="small">0..1</text>

  <path d="M1715 750 V850 H2065 V950" fill="none" stroke="#8294a9" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1811" y="832" width="190" height="32" rx="16" fill="#ffffff" stroke="#e5eaf1"/>
  <text x="1906" y="853" text-anchor="middle" class="edgeLabel">cosmetic batch</text>
  <text x="1727" y="770" class="small">0..*</text>
  <text x="2076" y="943" class="small">0..1</text>

  <!-- Product-to-batch associations. -->
  <path d="M570 1095 H690" fill="none" stroke="#71849b" stroke-width="2.2"/>
  <text x="578" y="1078" class="small">1</text>
  <text x="654" y="1078" class="small">0..*</text>
  <rect x="581" y="1104" width="99" height="30" rx="15" fill="#ffffff" stroke="#e3e9f1"/>
  <text x="630" y="1124" text-anchor="middle" class="edgeLabel">batches</text>

  <path d="M1720 1095 H1830" fill="none" stroke="#71849b" stroke-width="2.2"/>
  <text x="1728" y="1078" class="small">1</text>
  <text x="1791" y="1078" class="small">0..*</text>
  <rect x="1731" y="1104" width="89" height="30" rx="15" fill="#ffffff" stroke="#e3e9f1"/>
  <text x="1775" y="1124" text-anchor="middle" class="edgeLabel">batches</text>

  <!-- Batch stock movements are recorded as inventory transactions. -->
  <path d="M925 1280 V1350 H1080 V1430" fill="none" stroke="#8294a9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="936" y="1305" class="small">0..1</text>
  <rect x="954" y="1333" width="170" height="30" rx="15" fill="#ffffff" stroke="#e3e9f1"/>
  <text x="1039" y="1353" text-anchor="middle" class="edgeLabel">stock movements</text>
  <text x="1092" y="1418" class="small">0..*</text>

  <path d="M2065 1280 V1360 H1520 V1540" fill="none" stroke="#8294a9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="2076" y="1305" class="small">0..1</text>
  <text x="1490" y="1558" class="small">0..*</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="115" y="360" width="380" height="260" rx="16" fill="#ffffff" stroke="#dfe7f1" stroke-width="1.4"/>
    <path d="M131 360 H479 Q495 360 495 376 V430 H115 V376 Q115 360 131 360Z" fill="#f0ebff"/>
    <rect x="115" y="360" width="7" height="260" rx="3.5" fill="#7966a7"/>
    <text x="140" y="389" class="stereo" fill="#7966a7">ENTITY · ACCESS</text>
    <text x="140" y="419" class="className">User</text>
    <line x1="115" y1="430" x2="495" y2="430" stroke="#e7edf4"/>
    <text x="140" y="462" class="field">+ UserId: int</text>
    <text x="140" y="492" class="field">+ FullName: string</text>
    <text x="140" y="522" class="field">+ Email: string</text>
    <text x="140" y="552" class="field">+ RoleId: int</text>
    <text x="140" y="582" class="field">+ BranchId: int</text>
  </g>

  <!-- Sale -->
  <g filter="url(#shadow)">
    <rect x="650" y="360" width="500" height="360" rx="16" fill="#ffffff" stroke="#dfe7f1" stroke-width="1.4"/>
    <path d="M666 360 H1134 Q1150 360 1150 376 V430 H650 V376 Q650 360 666 360Z" fill="#f0ebff"/>
    <rect x="650" y="360" width="7" height="360" rx="3.5" fill="#7966a7"/>
    <text x="675" y="389" class="stereo" fill="#7966a7">ENTITY · SALES</text>
    <text x="675" y="419" class="className">Sale</text>
    <line x1="650" y1="430" x2="1150" y2="430" stroke="#e7edf4"/>
    <text x="675" y="462" class="field">+ SaleId: int</text>
    <text x="675" y="492" class="field">+ SaleNumber: string</text>
    <text x="675" y="522" class="field">+ BranchId: int</text>
    <text x="675" y="552" class="field">+ UserId: int</text>
    <text x="675" y="582" class="field">+ TotalAmount: decimal</text>
    <text x="675" y="612" class="field">+ TotalDiscount: decimal</text>
    <text x="675" y="642" class="field">+ PaymentStatus: string</text>
    <text x="675" y="682" class="field">+ Items: List&lt;SaleItem&gt;</text>
  </g>

  <!-- SaleItem -->
  <g filter="url(#shadow)">
    <rect x="1280" y="360" width="520" height="390" rx="16" fill="#ffffff" stroke="#dfe7f1" stroke-width="1.4"/>
    <path d="M1296 360 H1784 Q1800 360 1800 376 V430 H1280 V376 Q1280 360 1296 360Z" fill="#f0ebff"/>
    <rect x="1280" y="360" width="7" height="390" rx="3.5" fill="#7966a7"/>
    <text x="1305" y="389" class="stereo" fill="#7966a7">ENTITY · SALES</text>
    <text x="1305" y="419" class="className">SaleItem</text>
    <line x1="1280" y1="430" x2="1800" y2="430" stroke="#e7edf4"/>
    <text x="1305" y="462" class="field">+ SaleItemId: int</text>
    <text x="1305" y="492" class="field">+ SaleId: int</text>
    <text x="1305" y="522" class="field">+ ProductId?: int</text>
    <text x="1305" y="552" class="field">+ BatchId?: int</text>
    <text x="1305" y="582" class="field">+ CosmeticId?: int</text>
    <text x="1305" y="612" class="field">+ CosmeticBatchId?: int</text>
    <text x="1305" y="642" class="field">+ Quantity: int</text>
    <text x="1305" y="672" class="field">+ UnitPrice: decimal</text>
    <text x="1305" y="712" class="field">+ SubTotal: decimal</text>
  </g>

  <!-- Branch -->
  <g filter="url(#shadow)">
    <rect x="1930" y="360" width="440" height="270" rx="16" fill="#ffffff" stroke="#dfe7f1" stroke-width="1.4"/>
    <path d="M1946 360 H2354 Q2370 360 2370 376 V430 H1930 V376 Q1930 360 1946 360Z" fill="#f0ebff"/>
    <rect x="1930" y="360" width="7" height="270" rx="3.5" fill="#7966a7"/>
    <text x="1955" y="389" class="stereo" fill="#7966a7">ENTITY · STORE CONTEXT</text>
    <text x="1955" y="419" class="className">Branch</text>
    <line x1="1930" y1="430" x2="2370" y2="430" stroke="#e7edf4"/>
    <text x="1955" y="462" class="field">+ BranchId: int</text>
    <text x="1955" y="492" class="field">+ BranchName: string</text>
    <text x="1955" y="522" class="field">+ Location?: string</text>
    <text x="1955" y="562" class="field">+ Sales: List&lt;Sale&gt;</text>
  </g>

  <!-- Medicine -->
  <g filter="url(#shadow)">
    <rect x="120" y="950" width="450" height="300" rx="16" fill="#ffffff" stroke="#dfe7f1" stroke-width="1.4"/>
    <path d="M136 950 H554 Q570 950 570 966 V1020 H120 V966 Q120 950 136 950Z" fill="#e7f1fb"/>
    <rect x="120" y="950" width="7" height="300" rx="3.5" fill="#4778a8"/>
    <text x="145" y="979" class="stereo" fill="#4778a8">ENTITY · CATALOG</text>
    <text x="145" y="1009" class="className">Medicine</text>
    <line x1="120" y1="1020" x2="570" y2="1020" stroke="#e7edf4"/>
    <text x="145" y="1052" class="field">+ ProductId: int</text>
    <text x="145" y="1082" class="field">+ ProductCode: string</text>
    <text x="145" y="1112" class="field">+ BrandName: string</text>
    <text x="145" y="1142" class="field">+ GenericName: string</text>
    <text x="145" y="1172" class="field">+ SellingPrice: decimal</text>
    <text x="145" y="1202" class="field">+ ReorderLevel: int</text>
    <text x="145" y="1232" class="field">+ Batches: List&lt;MedicineBatch&gt;</text>
  </g>

  <!-- MedicineBatch -->
  <g filter="url(#shadow)">
    <rect x="690" y="950" width="470" height="330" rx="16" fill="#ffffff" stroke="#dfe7f1" stroke-width="1.4"/>
    <path d="M706 950 H1144 Q1160 950 1160 966 V1020 H690 V966 Q690 950 706 950Z" fill="#e7f1fb"/>
    <rect x="690" y="950" width="7" height="330" rx="3.5" fill="#4778a8"/>
    <text x="715" y="979" class="stereo" fill="#4778a8">ENTITY · MEDICINE STOCK</text>
    <text x="715" y="1009" class="className">MedicineBatch</text>
    <line x1="690" y1="1020" x2="1160" y2="1020" stroke="#e7edf4"/>
    <text x="715" y="1052" class="field">+ BatchId: int</text>
    <text x="715" y="1082" class="field">+ ProductId: int</text>
    <text x="715" y="1112" class="field">+ BranchId: int</text>
    <text x="715" y="1142" class="field">+ BatchNumber: string</text>
    <text x="715" y="1172" class="field">+ QuantityIssued: int</text>
    <text x="715" y="1202" class="field">+ RemainingQuantity: int {derived}</text>
    <text x="715" y="1242" class="field">+ ExpiryDate: DateTime</text>
  </g>

  <!-- Cosmetic -->
  <g filter="url(#shadow)">
    <rect x="1270" y="950" width="450" height="300" rx="16" fill="#ffffff" stroke="#dfe7f1" stroke-width="1.4"/>
    <path d="M1286 950 H1704 Q1720 950 1720 966 V1020 H1270 V966 Q1270 950 1286 950Z" fill="#e5f6f3"/>
    <rect x="1270" y="950" width="7" height="300" rx="3.5" fill="#218b83"/>
    <text x="1295" y="979" class="stereo" fill="#218b83">ENTITY · CATALOG</text>
    <text x="1295" y="1009" class="className">Cosmetic</text>
    <line x1="1270" y1="1020" x2="1720" y2="1020" stroke="#e7edf4"/>
    <text x="1295" y="1052" class="field">+ CosmeticId: int</text>
    <text x="1295" y="1082" class="field">+ ProductName: string</text>
    <text x="1295" y="1112" class="field">+ BranchId: int</text>
    <text x="1295" y="1142" class="field">+ SupplierId?: int</text>
    <text x="1295" y="1172" class="field">+ Price: decimal</text>
    <text x="1295" y="1212" class="field">+ Batches: List&lt;CosmeticBatch&gt;</text>
  </g>

  <!-- CosmeticBatch -->
  <g filter="url(#shadow)">
    <rect x="1830" y="950" width="470" height="330" rx="16" fill="#ffffff" stroke="#dfe7f1" stroke-width="1.4"/>
    <path d="M1846 950 H2284 Q2300 950 2300 966 V1020 H1830 V966 Q1830 950 1846 950Z" fill="#e5f6f3"/>
    <rect x="1830" y="950" width="7" height="330" rx="3.5" fill="#218b83"/>
    <text x="1855" y="979" class="stereo" fill="#218b83">ENTITY · COSMETIC STOCK</text>
    <text x="1855" y="1009" class="className">CosmeticBatch</text>
    <line x1="1830" y1="1020" x2="2300" y2="1020" stroke="#e7edf4"/>
    <text x="1855" y="1052" class="field">+ BatchId: int</text>
    <text x="1855" y="1082" class="field">+ CosmeticId: int</text>
    <text x="1855" y="1112" class="field">+ BranchId: int</text>
    <text x="1855" y="1142" class="field">+ BatchNumber: string</text>
    <text x="1855" y="1172" class="field">+ QuantityIssued: int</text>
    <text x="1855" y="1202" class="field">+ Balance: int {derived}</text>
    <text x="1855" y="1242" class="field">+ ExpiryDate?: DateTime</text>
  </g>

  <!-- InventoryTransaction -->
  <g filter="url(#shadow)">
    <rect x="920" y="1430" width="600" height="240" rx="16" fill="#ffffff" stroke="#dfe7f1" stroke-width="1.4"/>
    <path d="M936 1430 H1504 Q1520 1430 1520 1446 V1500 H920 V1446 Q920 1430 936 1430Z" fill="#e5f6f3"/>
    <rect x="920" y="1430" width="7" height="240" rx="3.5" fill="#218b83"/>
    <text x="945" y="1459" class="stereo" fill="#218b83">ENTITY · TRACEABILITY</text>
    <text x="945" y="1489" class="className">InventoryTransaction</text>
    <line x1="920" y1="1500" x2="1520" y2="1500" stroke="#e7edf4"/>
    <text x="945" y="1532" class="field">+ TransactionId: int</text>
    <text x="945" y="1562" class="field">+ TransactionType: string</text>
    <text x="945" y="1592" class="field">+ Quantity: int</text>
    <text x="1230" y="1532" class="field">+ UnitPrice: decimal</text>
    <text x="1230" y="1562" class="field">+ ReferenceType?: string</text>
    <text x="1230" y="1592" class="field">+ CreatedAt: DateTime</text>
  </g>

  <!-- Footer note -->
  <line x1="92" y1="1688" x2="2508" y2="1688" stroke="#e9eef4"/>
  <circle cx="108" cy="1701" r="4" fill="#7966a7"/>
  <text x="122" y="1707" class="small">? means nullable; {derived} is calculated from batch quantities. This view selects the classes used in sale and inventory processing.</text>
</svg>
