<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1420" viewBox="0 0 2600 1420" role="img" aria-labelledby="title desc">
  <title id="title">Milki Drug Store Management System components and modules</title>
  <desc id="desc">Functional modules for authentication, catalog, inventory, sales, purchases, damage and expiry, notifications, users, reporting, and administration, connected to shared persistence and PostgreSQL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#526174"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .host { fill: #f8fafc; stroke: #334155; stroke-width: 3; }
      .ui { fill: #edf4ff; stroke: #4778ad; stroke-width: 2.5; }
      .api { fill: #eeeaff; stroke: #7765a8; stroke-width: 2.5; }
      .module { fill: #ffffff; stroke: #7b8ca2; stroke-width: 2.1; }
      .moduleBlue { fill: #edf4ff; stroke: #4778ad; stroke-width: 2.2; }
      .moduleGreen { fill: #edf7f0; stroke: #4f8664; stroke-width: 2.2; }
      .moduleGold { fill: #fff5e7; stroke: #b77b25; stroke-width: 2.2; }
      .runtime { fill: #fff1f1; stroke: #b86161; stroke-width: 2.2; }
      .data { fill: #eaf7f7; stroke: #47828b; stroke-width: 2.2; }
      .external { fill: #ffffff; stroke: #65758b; stroke-width: 2.4; }
      .edge { fill: none; stroke: #526174; stroke-width: 2.6; marker-end: url(#arrow); }
      .dashedEdge { fill: none; stroke: #7c6aad; stroke-width: 2.3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .mainTitle { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #526174; }
      .titleText { font-size: 21px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 17px; text-anchor: middle; fill: #405066; }
      .edgeLabel { font-size: 15px; font-weight: 600; text-anchor: middle; fill: #526174; }
    </style>
  </defs>

  <rect width="2600" height="1420" fill="#ffffff"/>
  <text class="mainTitle" x="55" y="62">System Components and Modules</text>
  <text class="subtitle" x="57" y="101">Functional modules, key dependencies, and shared services</text>

  <!-- System boundary -->
  <rect class="host" x="820" y="140" width="1260" height="1120" rx="20"/>
  <text x="860" y="194" font-size="25" font-weight="700">ASP.NET Core API Host</text>
  <text x="860" y="222" font-size="16" fill="#526174">Functional backend modules share one service and database</text>

  <!-- Module grouping boundary -->
  <rect x="850" y="365" width="1200" height="680" rx="16" fill="#ffffff" stroke="#9aa8b8" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="880" y="402" font-size="18" font-weight="700" fill="#526174">BUSINESS / FUNCTIONAL MODULES</text>

  <!-- Flows behind cards -->
  <path class="edge" d="M 700 610 L 860 270"/>
  <path class="edge" d="M 1455 330 L 1455 365"/>
  <path class="edge" d="M 1240 510 L 1280 510"/>
  <path class="edge" d="M 1665 510 L 1630 510"/>
  <path class="edge" d="M 1240 650 L 1280 580"/>
  <path class="edge" d="M 1455 580 L 1455 635"/>
  <path class="edge" d="M 1630 550 L 1650 550 L 1670 655"/>
  <path class="edge" d="M 1630 710 L 1670 710"/>
  <path class="edge" d="M 1455 1045 L 1455 1080"/>
  <path class="edge" d="M 2050 1140 L 2190 1140"/>

  <!-- User -->
  <rect class="external" x="40" y="500" width="245" height="220" rx="18"/>
  <circle cx="162" cy="548" r="17" fill="none" stroke="#263548" stroke-width="3"/>
  <path d="M 162 565 L 162 602 M 140 581 L 184 581 M 162 602 L 144 626 M 162 602 L 180 626" fill="none" stroke="#263548" stroke-width="3" stroke-linecap="round"/>
  <text class="titleText" x="162" y="666">Store Staff</text>
  <text class="body" x="162" y="695">Administrator · Pharmacist</text>
  <text class="edgeLabel" x="323" y="599">uses</text>

  <!-- Frontend client -->
  <rect class="ui" x="365" y="370" width="335" height="480" rx="18"/>
  <text class="titleText" x="532" y="414">React Browser App</text>
  <line x1="390" y1="435" x2="675" y2="435" stroke="#b2c8e3" stroke-width="2"/>
  <text class="body" x="532" y="478">Login and password recovery</text>
  <text class="body" x="532" y="520">POS and receipt pages</text>
  <text class="body" x="532" y="562">Inventory and damage/expiry</text>
  <text class="body" x="532" y="604">Purchases and suppliers</text>
  <text class="body" x="532" y="646">Users and settings</text>
  <text class="body" x="532" y="688">Dashboard and reports</text>
  <rect x="694" y="408" width="170" height="72" rx="8" fill="#ffffff" stroke="#d8dee8"/>
  <text class="edgeLabel" x="779" y="437">HTTPS REST/JSON</text>
  <text class="edgeLabel" x="779" y="461">JWT bearer token</text>

  <!-- API surface and cross-cutting security -->
  <rect class="api" x="860" y="240" width="1190" height="90" rx="14"/>
  <text class="titleText" x="1455" y="274">API Surface and Shared Access Control</text>
  <text class="body" x="1455" y="306">REST controllers · JWT authentication · role authorization · CORS / exception handling</text>

  <!-- Functional module cards: row one -->
  <rect class="moduleBlue" x="885" y="435" width="355" height="150" rx="14"/>
  <text class="titleText" x="1062" y="478">Product Catalog</text>
  <text class="body" x="1062" y="519">Medicines · cosmetics</text>
  <text class="body" x="1062" y="548">Categories · unit types</text>

  <rect class="moduleGreen" x="1280" y="435" width="350" height="150" rx="14"/>
  <text class="titleText" x="1455" y="478">Inventory and Batches</text>
  <text class="body" x="1455" y="519">Stock · batch tracking · FEFO</text>
  <text class="body" x="1455" y="548">Low-stock levels</text>

  <rect class="moduleGold" x="1665" y="435" width="355" height="150" rx="14"/>
  <text class="titleText" x="1842" y="478">POS and Sales</text>
  <text class="body" x="1842" y="519">Transactions · discounts</text>
  <text class="body" x="1842" y="548">Payment records · receipts</text>

  <!-- Functional module cards: row two -->
  <rect class="moduleGold" x="885" y="635" width="355" height="150" rx="14"/>
  <text class="titleText" x="1062" y="678">Purchases and Suppliers</text>
  <text class="body" x="1062" y="719">Purchase / stock receipts</text>
  <text class="body" x="1062" y="748">Supplier payment status</text>

  <rect class="module" x="1280" y="635" width="350" height="150" rx="14"/>
  <text class="titleText" x="1455" y="678">Damage and Expiry</text>
  <text class="body" x="1455" y="719">Damage / lost-stock records</text>
  <text class="body" x="1455" y="748">Expiring and expired batches</text>

  <rect class="moduleBlue" x="1665" y="635" width="355" height="150" rx="14"/>
  <text class="titleText" x="1842" y="678">Notifications</text>
  <text class="body" x="1842" y="719">Low-stock and expiry alerts</text>
  <text class="body" x="1842" y="748">Mark notifications as read</text>

  <!-- Functional module cards: row three -->
  <rect class="module" x="885" y="835" width="355" height="150" rx="14"/>
  <text class="titleText" x="1062" y="878">User and Branch Admin</text>
  <text class="body" x="1062" y="919">Accounts · roles · approvals</text>
  <text class="body" x="1062" y="948">Branch management</text>

  <rect class="moduleGreen" x="1280" y="835" width="350" height="150" rx="14"/>
  <text class="titleText" x="1455" y="878">Dashboard and Reports</text>
  <text class="body" x="1455" y="919">Sales · profit · inventory</text>
  <text class="body" x="1455" y="948">Supplier · staff reporting</text>

  <rect class="module" x="1665" y="835" width="355" height="150" rx="14"/>
  <text class="titleText" x="1842" y="878">Settings and Audit</text>
  <text class="body" x="1842" y="919">Store configuration · audit logs</text>
  <text class="body" x="1842" y="948">Backup and restore</text>

  <!-- Shared platform components -->
  <rect class="runtime" x="860" y="1080" width="560" height="125" rx="14"/>
  <text class="titleText" x="1140" y="1118">Shared Runtime Services</text>
  <text class="body" x="1140" y="1153">Expiry / notification / retention jobs</text>
  <text class="body" x="1140" y="1182">SMTP · file storage · monitoring · logging</text>

  <rect class="data" x="1450" y="1080" width="600" height="125" rx="14"/>
  <text class="titleText" x="1750" y="1118">Shared Persistence</text>
  <text class="body" x="1750" y="1153">EF Core · repositories · Unit of Work</text>
  <text class="body" x="1750" y="1182">AppDbContext · migrations</text>

  <!-- Database -->
  <rect class="external" x="2190" y="1060" width="340" height="170" rx="18"/>
  <ellipse cx="2360" cy="1102" rx="72" ry="19" fill="#eaf7f3" stroke="#4f8664" stroke-width="2.2"/>
  <path d="M 2288 1102 L 2288 1152 C 2288 1173 2432 1173 2432 1152 L 2432 1102 M 2288 1127 C 2288 1148 2432 1148 2432 1127" fill="#eaf7f3" stroke="#4f8664" stroke-width="2.2"/>
  <text class="titleText" x="2360" y="1200">PostgreSQL</text>
  <text class="body" x="2360" y="1223">Npgsql provider</text>

  <!-- Module flow labels -->
  <rect x="1262" y="591" width="90" height="25" rx="5" fill="#ffffff"/>
  <text class="edgeLabel" x="1307" y="609">receives stock</text>
  <rect x="1635" y="785" width="120" height="25" rx="5" fill="#ffffff"/>
  <text class="edgeLabel" x="1695" y="803">expiry alerts</text>
  <text class="edgeLabel" x="1775" y="1060">shared data</text>
  <text class="edgeLabel" x="2120" y="1124">Npgsql</text>
</svg>
