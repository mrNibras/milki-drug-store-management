services:
  - type: web
    name: milki-drug-store-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http+:8080
      - key: JwtSettings__Secret
        generateValue: true
      - key: JwtSettings__Issuer
        value: MilkiDrugStore
      - key: JwtSettings__Audience
        value: MilkiDrugStoreClient
      - key: JwtSettings__ExpiryMinutes
        value: "60"
      - key: AdminEmail
        value: admin@milki.com
      - key: AllowedOrigins
        value: https://milki-drug-store-management.vercel.app
      - key: DataDirectory
        value: /var/data
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: milki-drug-store-db
          property: connectionUrl
      - key: FileStorage__Provider
        value: s3
      - key: FileStorage__S3__BucketName
        value: milki-drug-store-uploads
      - key: FileStorage__S3__Region
        value: us-east-1
      - key: DatabaseMonitoring__WarningThresholdGB
        value: "5"
      - key: DatabaseMonitoring__CriticalThresholdGB
        value: "10"
      - key: Retention__AuditLogRetentionDays
        value: "1095"
      - key: Retention__NotificationRetentionDays
        value: "180"
    healthCheckPath: /health
    disk:
      name: milki-data
      mountPath: /var/data
      sizeGB: 1
    region: virginia

databases:
  - name: milki-drug-store-db
    region: virginia
    plan: free
