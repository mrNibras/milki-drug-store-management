services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: milki_drug_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourStrong@Pass123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=localhost;Port=5432;Database=milki_drug_store;Username=postgres;Password=YourStrong@Pass123;SslMode=Disable
      - FileStorage__Provider=local
      - FileStorage__Local__BasePath=/var/data/uploads
      - DataDirectory=/var/data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - milki-data:/var/data

volumes:
  postgres-data:
  milki-data:
